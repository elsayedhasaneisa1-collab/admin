<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXAMORA | مولّد أكواد البرايم 👑</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={
  apiKey:"AIzaSyDUqcwR53iSNt5tc1QKCW0ReiFpMP7IW1k",
  authDomain:"nexora-a83c0.firebaseapp.com",
  projectId:"nexora-a83c0",
  databaseURL:"https://nexora-a83c0-default-rtdb.firebaseio.com",
  appId:"1:394125653608:web:c8a83ab04694b7476eeddd"
};
firebase.initializeApp(firebaseConfig);
const rtdb=firebase.database();
const auth=firebase.auth();
</script>
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{background:#0a0e1a;color:#fff;min-height:100vh;margin:0;padding:16px}
.card{background:linear-gradient(160deg,rgba(22,28,52,.9),rgba(12,16,32,.95));border:1px solid rgba(245,158,11,.14);border-radius:20px;backdrop-filter:blur(18px);padding:20px}
.gold{background:linear-gradient(135deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.btn-gold{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1a1000;font-weight:900;border:none;cursor:pointer;padding:12px 20px;border-radius:12px;width:100%;font-size:14px}
.btn-gold:hover{opacity:.9}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-weight:900;border:none;cursor:pointer;padding:10px 16px;border-radius:10px;font-size:12px}
input,select{background:#0e152c!important;color:#fff!important;border:1px solid rgba(245,158,11,.2)!important;border-radius:12px!important;width:100%;padding:12px;font-size:14px}
.code-box{background:#000;border:1px dashed rgba(16,185,129,.5);border-radius:12px;padding:14px;font-family:monospace;font-size:16px;text-align:center;letter-spacing:2px;color:#6ee7b7;font-weight:900;cursor:pointer}
.code-box:hover{background:#0a1f17}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.08)}
th{background:rgba(245,158,11,.1);color:#fbbf24;font-weight:900}
tr:hover{background:rgba(255,255,255,.03)}
.badge{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:900}
.badge.ok{background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid rgba(16,185,129,.4)}
.badge.no{background:rgba(239,68,68,.2);color:#fca5a5;border:1px solid rgba(239,68,68,.4)}
.badge.used{background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid rgba(245,158,11,.4)}
#toastBox{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:92%;max-width:400px}
.toast{padding:14px;border-radius:12px;font-size:13px;font-weight:800;animation:slide .3s}
.toast.ok{background:linear-gradient(135deg,#10b981,#059669)}
.toast.err{background:linear-gradient(135deg,#ef4444,#dc2626)}
.toast.info{background:linear-gradient(135deg,#1e293b,#334155)}
@keyframes slide{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="toastBox"></div>

<!-- شاشة الدخول -->
<div id="loginScreen" class="max-w-md mx-auto mt-20">
  <div class="card text-center">
    <div class="text-5xl mb-4">🔐</div>
    <h1 class="text-2xl gold mb-2">لوحة الأدمن</h1>
    <p class="text-slate-400 text-sm mb-6">دخول مخصص للمسؤول فقط</p>
    <input type="password" id="adminPass" placeholder="اكتب كلمة السر" onkeypress="if(event.key==='Enter')login()">
    <button class="btn-gold mt-4" onclick="login()">دخول 🚀</button>
    <p class="text-[10px] text-slate-500 mt-4">⚠️ أي محاولة دخول غلط بتتسجل</p>
  </div>
</div>

<!-- لوحة التحكم -->
<div id="adminPanel" class="hidden max-w-6xl mx-auto">
  
  <div class="card mb-4 flex justify-between items-center flex-wrap gap-3">
    <div>
      <h1 class="text-xl gold">👑 مولّد أكواد البرايم</h1>
      <p class="text-xs text-slate-400 mt-1">EXAMORA Admin Panel</p>
    </div>
    <button class="btn-red" onclick="logout()">خروج 🚪</button>
  </div>

  <!-- إحصائيات -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
    <div class="card text-center">
      <div class="text-2xl">📊</div>
      <div class="text-2xl font-black gold mt-1" id="totalCodes">0</div>
      <div class="text-[10px] text-slate-400">إجمالي الأكواد</div>
    </div>
    <div class="card text-center">
      <div class="text-2xl">✅</div>
      <div class="text-2xl font-black text-emerald-400 mt-1" id="activeCodes">0</div>
      <div class="text-[10px] text-slate-400">نشطة</div>
    </div>
    <div class="card text-center">
      <div class="text-2xl">🔒</div>
      <div class="text-2xl font-black text-amber-400 mt-1" id="usedCodes">0</div>
      <div class="text-[10px] text-slate-400">مستخدمة</div>
    </div>
    <div class="card text-center">
      <div class="text-2xl">⌛</div>
      <div class="text-2xl font-black text-red-400 mt-1" id="expiredCodes">0</div>
      <div class="text-[10px] text-slate-400">منتهية</div>
    </div>
  </div>

  <!-- توليد كود جديد -->
  <div class="card mb-4">
    <h2 class="font-black text-lg mb-4">⚡ توليد كود جديد</h2>
    <div class="grid md:grid-cols-3 gap-3 mb-3">
      <div>
        <label class="text-xs text-slate-400 mb-1 block">المدة (بالأيام)</label>
        <select id="duration">
          <option value="7">7 أيام</option>
          <option value="15">15 يوم</option>
          <option value="30" selected>30 يوم</option>
          <option value="60">60 يوم</option>
          <option value="90">90 يوم</option>
          <option value="365">سنة كاملة</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-slate-400 mb-1 block">النوع</label>
        <select id="codeType">
          <option value="VIP">VIP عادي</option>
          <option value="BLACK">VIP BLACK 👑</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-slate-400 mb-1 block">عدد الأكواد</label>
        <input type="number" id="count" value="1" min="1" max="50">
      </div>
    </div>
    <button class="btn-gold" onclick="generateCodes()">🎲 توليد</button>

    <!-- الأكواد المولدة -->
    <div id="generatedBox" class="hidden mt-4">
      <p class="text-xs text-slate-400 mb-2">✅ تم التوليد — دوس على أي كود للنسخ:</p>
      <div id="generatedList" class="grid gap-2"></div>
      <button class="btn-gold mt-3" style="background:linear-gradient(135deg,#10b981,#059669);color:#fff" onclick="copyAll()">📋 نسخ الكل</button>
    </div>
  </div>

  <!-- قائمة الأكواد -->
  <div class="card">
    <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
      <h2 class="font-black text-lg">📋 كل الأكواد</h2>
      <div class="flex gap-2">
        <input id="searchInput" placeholder="🔍 ابحث..." oninput="renderCodes()" style="width:200px;padding:8px">
        <button class="btn-red" onclick="deleteExpired()">حذف المنتهية</button>
      </div>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>الكود</th>
            <th>النوع</th>
            <th>الحالة</th>
            <th>ينتهي</th>
            <th>مستخدم بواسطة</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="codesTable">
          <tr><td colspan="6" class="text-center text-slate-500 py-6">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
// ⚠️ غيّر كلمة السر دي لحاجة معقدة وصعب تخمينها
const ADMIN_PASSWORD = "Examora@Admin2025#Black";

let allCodes = [];
let lastGenerated = [];

// ============ تسجيل الدخول ============
async function login(){
  const pass = document.getElementById('adminPass').value;
  if(pass !== ADMIN_PASSWORD){
    showToast('❌ كلمة السر غلط', 'err');
    // سجل المحاولة
    try {
      await rtdb.ref('admin_login_attempts/'+Date.now()).set({
        time: Date.now(),
        userAgent: navigator.userAgent,
        success: false
      });
    } catch(e){}
    return;
  }
  sessionStorage.setItem('admin_logged', '1');
  showToast('✅ مرحباً يا أدمن', 'ok');
  await auth.signInAnonymously().catch(()=>{});
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  loadCodes();
}

function logout(){
  sessionStorage.removeItem('admin_logged');
  location.reload();
}

// تحقق من الجلسة
if(sessionStorage.getItem('admin_logged') === '1'){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('adminPanel').classList.remove('hidden');
  auth.signInAnonymously().then(loadCodes).catch(loadCodes);
}

// ============ توليد الأكواد ============
function makeCode(type){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // بدون حروف متشابهة
  let prefix = type === 'BLACK' ? 'BLK' : 'VIP';
  let random = '';
  for(let i=0; i<6; i++){
    random += chars[Math.floor(Math.random()*chars.length)];
  }
  return prefix + '-' + random;
}

async function generateCodes(){
  const duration = parseInt(document.getElementById('duration').value);
  const type = document.getElementById('codeType').value;
  const count = Math.min(50, Math.max(1, parseInt(document.getElementById('count').value)||1));
  
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳ جاري التوليد...';

  try {
    const expireAt = Date.now() + (duration * 24 * 60 * 60 * 1000);
    const newCodes = [];
    const updates = {};

    for(let i=0; i<count; i++){
      let code = makeCode(type);
      // تأكد إن الكود مش مكرر
      while(allCodes.some(c => c.code === code)){
        code = makeCode(type);
      }
      updates['accessCodes/'+code] = {
        code: code,
        type: type,
        createdAt: Date.now(),
        expiresAt: expireAt,
        duration: duration,
        activated: false,
        uid: null,
        activatedAt: null
      };
      newCodes.push(code);
    }

    await rtdb.ref().update(updates);
    lastGenerated = newCodes;

    // اعرض الأكواد
    const list = document.getElementById('generatedList');
    list.innerHTML = newCodes.map(c => 
      `<div class="code-box" onclick="copyCode('${c}', this)">${c}</div>`
    ).join('');
    document.getElementById('generatedBox').classList.remove('hidden');

    showToast(`✅ تم توليد ${newCodes.length} كود`, 'ok');
    loadCodes();
  } catch(e){
    showToast('❌ ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '🎲 توليد';
  }
}

function copyCode(code, el){
  navigator.clipboard.writeText(code).then(()=>{
    showToast('📋 اتنسخ: ' + code, 'ok');
    el.style.background = '#065f46';
    setTimeout(()=>{ el.style.background = '#000'; }, 600);
  });
}

function copyAll(){
  const text = lastGenerated.join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    showToast(`📋 اتنسخ ${lastGenerated.length} كود`, 'ok');
  });
}

// ============ عرض الأكواد ============
async function loadCodes(){
  try {
    const snap = await rtdb.ref('accessCodes').once('value');
    allCodes = [];
    if(snap.exists()){
      snap.forEach(child => {
        allCodes.push({ id: child.key, ...child.val() });
      });
    }
    // رتب من الأحدث
    allCodes.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    updateStats();
    renderCodes();
  } catch(e){
    showToast('❌ ' + e.message, 'err');
  }
}

function updateStats(){
  const now = Date.now();
  let active = 0, used = 0, expired = 0;
  allCodes.forEach(c => {
    const isExp = c.expiresAt && c.expiresAt < now;
    if(isExp) expired++;
    else if(c.activated) used++;
    else active++;
  });
  document.getElementById('totalCodes').textContent = allCodes.length;
  document.getElementById('activeCodes').textContent = active;
  document.getElementById('usedCodes').textContent = used;
  document.getElementById('expiredCodes').textContent = expired;
}

function renderCodes(){
  const search = (document.getElementById('searchInput').value||'').trim().toUpperCase();
  const now = Date.now();
  const tbody = document.getElementById('codesTable');

  let filtered = allCodes.filter(c => 
    !search || c.code.includes(search) || (c.uid||'').includes(search)
  );

  if(filtered.length === 0){
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-slate-500 py-6">مفيش أكواد</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(c => {
    const isExp = c.expiresAt && c.expiresAt < now;
    let badge, statusText;
    if(isExp){
      badge = 'no'; statusText = '⌛ منتهي';
    } else if(c.activated){
      badge = 'used'; statusText = '🔒 مستخدم';
    } else {
      badge = 'ok'; statusText = '✅ نشط';
    }
    const expDate = c.expiresAt ? new Date(c.expiresAt).toLocaleDateString('ar-EG') : '—';
    const typeBadge = c.type === 'BLACK' 
      ? '<span class="badge" style="background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff">👑 BLACK</span>'
      : '<span class="badge" style="background:rgba(245,158,11,.2);color:#fbbf24">VIP</span>';

    return `<tr>
      <td><span class="code-box" style="padding:6px 10px;font-size:12px;display:inline-block;letter-spacing:1px" onclick="copyCode('${c.code}', this)">${c.code}</span></td>
      <td>${typeBadge}</td>
      <td><span class="badge ${badge}">${statusText}</span></td>
      <td style="font-size:11px;color:#94a3b8">${expDate}</td>
      <td style="font-size:11px;color:#94a3b8">${c.uid ? c.uid.slice(0,12)+'...' : '—'}</td>
      <td>
        <button class="btn-red" style="padding:6px 10px;font-size:10px" onclick="deleteCode('${c.code}')">🗑️</button>
        ${c.activated ? `<button class="btn-red" style="padding:6px 10px;font-size:10px;background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#000" onclick="resetCode('${c.code}')">♻️</button>` : ''}
      </td>
    </tr>`;
  }).join('');
}

async function deleteCode(code){
  if(!confirm('تأكيد حذف الكود: ' + code + '؟')) return;
  try {
    await rtdb.ref('accessCodes/'+code).remove();
    showToast('🗑️ اتحذف', 'ok');
    loadCodes();
  } catch(e){ showToast('❌ '+e.message, 'err'); }
}

async function resetCode(code){
  if(!confirm('إعادة تعيين الكود ' + code + '؟\n(هيبقى متاح لمستخدم جديد)')) return;
  try {
    await rtdb.ref('accessCodes/'+code).update({
      activated: false,
      uid: null,
      activatedAt: null
    });
    showToast('♻️ اتعاد تعيينه', 'ok');
    loadCodes();
  } catch(e){ showToast('❌ '+e.message, 'err'); }
}

async function deleteExpired(){
  const now = Date.now();
  const expired = allCodes.filter(c => c.expiresAt && c.expiresAt < now);
  if(expired.length === 0){ showToast('مفيش أكواد منتهية', 'info'); return; }
  if(!confirm(`حذف ${expired.length} كود منتهي؟`)) return;
  try {
    const updates = {};
    expired.forEach(c => { updates['accessCodes/'+c.code] = null; });
    await rtdb.ref().update(updates);
    showToast(`🗑️ اتحذف ${expired.length} كود`, 'ok');
    loadCodes();
  } catch(e){ showToast('❌ '+e.message, 'err'); }
}

// ============ Toast ============
function showToast(msg, type='info'){
  const box = document.getElementById('toastBox');
  const div = document.createElement('div');
  div.className = 'toast ' + type;
  div.textContent = msg;
  box.appendChild(div);
  setTimeout(()=>{ div.style.opacity='0'; setTimeout(()=>div.remove(),300); }, 3000);
}
</script>
</body>
</html>
